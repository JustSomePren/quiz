q": "Aktivní přístup k pozitivnímu ovlivňování širší komunity, ve které firma působí, je typický pro:", "opts": ["Transformační leadership", "Situační leadership", "Servant leadership", "Vyvažený leadership"], "correct": 2, "variants": ["Který styl leadershipu klade důraz na službu širší komunitě?", "Aktivní přístup k pozitivnímu ovlivňování širší komunity, ve které firma působí, je typický pro — vyber správnou možnost:"]}, {"id": 114, "q": "Který z následujících stylů leadershipu podle studie GLOBE je charakterizován tím, že zdůrazňuje soucit, velkorysost, trpělivost, podporu druhých a důraz na well-being pracovníků?", "opts": ["Empatický", "Participativní", "Humánní", "Protektivní"], "correct": 2, "variants": ["GLOBE: který styl leadershipu je spojen se soucitem a péčí o well-being?", "Odpověz správně: Který z následujících stylů leadershipu podle studie GLOBE je charakterizován tím, že zdůrazňuje soucit, velkorysost, trpělivost, podporu druhých a důraz na well-being pracovníků?"]}];
const LS_KEY = "ucici-kviz-progress-v1";
const LETTERS = ["A","B","C","D","E","F"];

let progress = loadProgress();
let mode = "learn";
let lastId = null;
let current = null;
let shuffled = [];
let testQueue = [];
let testPos = 0;
let session = { asked: 0, correct: 0 };

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}
function saveProgress() { localStorage.setItem(LS_KEY, JSON.stringify(progress)); }
function st(id) { return progress[id] || { n: 0, c: 0, s: 0 }; }
function isMastered(id) { const s = st(id); return s.s >= 3 && s.n >= 3; }

function weight(id) {
  const s = st(id);
  let w = 1;
  if (s.n === 0) w += 3;
  w += 2 * (s.n - s.c);
  w -= Math.min(s.s, 3) * 0.7;
  if (isMastered(id)) w *= 0.15;
  w += Math.random() * 0.8;
  return Math.max(w, 0.05);
}

function pickQuestion() {
  let pool;
  if (mode === "weak") {
    pool = QUESTIONS.filter(q => { const s = st(q.id); return s.n > 0 && s.n - s.c > 0; });
    if (!pool.length) pool = QUESTIONS.filter(q => st(q.id).n === 0);
    if (!pool.length) { mode = "learn"; syncModes(); pool = QUESTIONS; }
  } else if (mode === "test") {
    if (testPos >= testQueue.length) return null;
    return QUESTIONS.find(q => q.id === testQueue[testPos++]);
  } else {
    pool = QUESTIONS;
  }
  pool = pool.filter(q => q.id !== lastId);
  let total = 0;
  for (const q of pool) total += weight(q.id);
  let r = Math.random() * total;
  for (const q of pool) { r -= weight(q.id); if (r <= 0) return q; }
  return pool[pool.length - 1];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStats() {
  const asked = QUESTIONS.filter(q => st(q.id).n > 0).length;
  const totalC = QUESTIONS.reduce((a, q) => a + st(q.id).c, 0);
  const totalN = QUESTIONS.reduce((a, q) => a + st(q.id).n, 0);
  const mastered = QUESTIONS.filter(q => isMastered(q.id)).length;
  document.getElementById("st-asked").textContent = `Zodpovězeno: ${asked} / ${QUESTIONS.length}`;
  document.getElementById("st-correct").textContent = `Správně: ${totalN ? Math.round(100 * totalC / totalN) : 0} %`;
  document.getElementById("st-mastered").textContent = `Zvládnuto: ${mastered}`;
}

function renderPanel() {
  const list = document.getElementById("qlist");
  const sorted = QUESTIONS.slice().sort((a, b) => {
    const sa = st(a.id), sb = st(b.id);
    const wa = (sa.n - sa.c) * 2 - Math.min(sa.s, 3);
    const wb = (sb.n - sb.c) * 2 - Math.min(sb.s, 3);
    return wb - wa;
  });
  list.innerHTML = sorted.map(q => {
    const s = st(q.id);
    let cls = "new", label = "nová";
    if (isMastered(q.id)) { cls = "master"; label = "zvládnuto"; }
    else if (s.n > 0 && s.n - s.c > 0) { cls = "weak"; label = `chyby: ${s.n - s.c}`; }
    else if (s.n > 0) { cls = "ok"; label = `OK ×${s.c}`; }
    return `<div class="qrow" data-id="${q.id}"><span class="dot ${cls}"></span><span class="qt">${esc(q.q)}</span><span class="qn">${label}</span></div>`;
  }).join("");
  list.querySelectorAll(".qrow").forEach(row => {
    row.addEventListener("click", () => { lastId = null; current = QUESTIONS.find(q => q.id === +row.dataset.id); renderQuestion(); });
  });
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function questionText(q) {
  const all = [q.q, ...(q.variants || [])];
  return all[Math.floor(Math.random() * all.length)];
}

function renderQuestion() {
  if (!current) current = pickQuestion();
  if (!current) { renderSummary(); return; }
  lastId = current.id;
  const app = document.getElementById("app");
  const s = st(current.id);
  shuffled = shuffle(current.opts.map((_, i) => i));
  const pct = mode === "test" ? Math.round(100 * (testPos - 1) / testQueue.length) : Math.round(100 * QUESTIONS.filter(q => st(q.id).n > 0).length / QUESTIONS.length);
  app.innerHTML = `
    <div class="qmeta">${mode === "test" ? `Test: otázka ${testPos} z ${testQueue.length}` : `Adaptivní výběr · tato otázka: ${s.n}× zadána, ${s.c}× správně`} · celkem ${QUESTIONS.length} otázek</div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="question">${esc(questionText(current))}</div>
    <div class="answers">
      ${shuffled.map((orig, i) => `<button data-orig="${orig}"><span class="key">${LETTERS[i]}</span><span>${esc(current.opts[orig])}</span></button>`).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next">Další otázka →</button>`;
  app.querySelectorAll(".answers button").forEach(btn => {
    btn.addEventListener("click", () => answer(+btn.dataset.orig));
  });
  document.getElementById("next").addEventListener("click", nextQuestion);
}

function answer(orig) {
  const buttons = document.querySelectorAll(".answers button");
  buttons.forEach(b => b.disabled = true);
  const correct = current.correct === orig;
  buttons.forEach(b => { if (+b.dataset.orig === current.correct) b.classList.add("correct"); });
  if (!correct) buttons.forEach(b => { if (+b.dataset.orig === orig) b.classList.add("wrong"); });
  const s = st(current.id);
  s.n++; if (correct) { s.c++; s.s++; session.correct++; } else { s.s = 0; }
  session.asked++;
  progress[current.id] = s;
  saveProgress();
  const fb = document.getElementById("feedback");
  if (correct) { fb.textContent = "✔ Správně!"; fb.style.color = "#81c784"; }
  else {
    fb.textContent = `✘ Špatně — správná odpověď: ${LETTERS[shuffled.indexOf(current.correct)]}. ${current.opts[current.correct]}`;
    fb.style.color = "#e57373";
  }
  const nextBtn = document.getElementById("next");
  nextBtn.style.display = "block";
  nextBtn.textContent = mode === "test" && testPos >= testQueue.length ? "Zobrazit výsledek →" : "Další otázka →";
  renderStats();
  if (document.getElementById("panel").classList.contains("open")) renderPanel();
}

function nextQuestion() {
  current = pickQuestion();
  renderQuestion();
}

function renderSummary() {
  const pct = session.asked ? Math.round(100 * session.correct / session.asked) : 0;
  document.getElementById("app").innerHTML = `
    <div class="summary">
      <h2>Konec — přehled tohoto běhu</h2>
      <div class="big">${session.correct} / ${session.asked} (${pct} %)</div>
      <p>${pct >= 90 ? "Výborně! 🎉" : pct >= 70 ? "Dobrá práce! 👍" : "Zkus znovu, adaptivní režim se zaměří na slabá místa. 💪"}</p>
      <button class="next" style="display:block; margin-top:18px;" id="again">Hrát znovu</button>
    </div>`;
  document.getElementById("again").addEventListener("click", startMode);
  renderStats();
}

function startMode() {
  session = { asked: 0, correct: 0 };
  if (mode === "test") {
    testQueue = QUESTIONS.map(q => q.id).sort(() => Math.random() - 0.5);
    testPos = 0;
  }
  current = null;
  renderQuestion();
}

function syncModes() {
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
}

document.querySelectorAll(".modes button").forEach(b => {
  b.addEventListener("click", () => { mode = b.dataset.mode; syncModes(); startMode(); });
});
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Opravdu smazat veškerý pokrok?")) { progress = {}; saveProgress(); renderStats(); renderPanel(); }
});
document.getElementById("panel-toggle").addEventListener("click", () => {
  document.getElementById("panel").classList.toggle("open");
  if (document.getElementById("panel").classList.contains("open")) renderPanel();
});
document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "6" && current && document.getElementById("feedback").textContent === "") {
    const i = +e.key - 1;
    if (i < shuffled.length) answer(shuffled[i]);
  } else if (e.key === "Enter" && document.getElementById("next") && document.getElementById("next").style.display === "block") {
    nextQuestion();
  }
});

renderStats();
startMode();
</script>
</body>
</html>
